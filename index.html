<!DOCTYPE html>
<html>
<head>
	<title>kiss________me</title>
	<style>
		body {
			margin: .8em 0 0 0;
			height: 100vh;
			overflow: hidden;
			background: white;
			display: flex;
			justify-content: center;
			align-items: center;
			transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
		}
		
		#container {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			width: 100vw;
			padding: 3em;
			gap: 3em;
			transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
			transform-origin: center;
			box-sizing: border-box;
		}
		
		.image-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
			width: calc(25% - 2.25em);
			height: 100%;
			position: relative;
		}
		
		img {
			width: auto;
			height: auto;
			max-width: 100%;
			max-height: 70%;
			object-fit: contain;
			cursor: pointer;
			transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
			transform-origin: center;
		}
		
		img:hover { transform: scale(1.02); }
		
		p {
			margin-top: 3em;
			font-size: .9em;
			height: 1.5em;
			opacity: 0;
			transition: opacity 0.3s ease;
			text-align: center;
			white-space: nowrap;
			display: flex;
			align-items: center;
			justify-content: center;
			color: black;
			pointer-events: none;
			transform-origin: center;
		}
		
		img:hover + p { opacity: 1; }
	</style>
</head>
<body>
	<div id="container">
		<div class="image-wrapper"><img src="assets/1.png"><p>garments_</p></div>
		<div class="image-wrapper"><img src="assets/2.png"><p>image____</p></div>
		<div class="image-wrapper"><img src="assets/3.png"><p>about____</p></div>
		<div class="image-wrapper"><img src="assets/4.png"><p>contact__</p></div>
	</div>
	
	<script>
		function handleResize() {
			const container = document.getElementById('container');
			const imageWrappers = document.querySelectorAll('.image-wrapper');
			const images = document.querySelectorAll('img');
			const texts = document.querySelectorAll('p');
			const width = window.innerWidth;
			
			const maxWidth = 1200, verticalWidth = 800, minWidth = 400;
			let angle = 0;
			
			if (width <= maxWidth && width >= verticalWidth) {
				angle = 90 * (maxWidth - width) / (maxWidth - verticalWidth);
			} else if (width < verticalWidth && width >= minWidth) {
				angle = 90;
			} else if (width < minWidth) {
				angle = 90;
			}
			
			const rotationProgress = angle / 90;
			const isVerticalMode = width <= verticalWidth || angle >= 90;
			const counterAngle = -angle;
			
			container.style.transform = `rotate(${angle}deg)`;
			
			let containerPadding = '3em', containerGap = '3em';
			if (angle >= 90) {
				containerPadding = containerGap = '2em';
			} else if (angle > 70) {
				containerPadding = containerGap = '2em';
			} else if (angle > 30) {
				const adjustProgress = (angle - 30) / 40;
				containerPadding = containerGap = `${3 - (adjustProgress * 1)}em`;
			}
			
			container.style.padding = containerPadding;
			container.style.gap = containerGap;
			
			images.forEach(img => img.style.transform = `rotate(${counterAngle}deg)`);
			
			texts.forEach(p => {
				p.style.transform = `rotate(${counterAngle}deg)`;
				p.style.opacity = isVerticalMode || angle > 80 ? '1' : '0';
				p.style.paddingRight = isVerticalMode ? '2em' : '0';
				
				if (angle >= 90) p.style.fontSize = '0.85em';
				else if (angle > 60) p.style.fontSize = '0.85em';
				else if (angle > 30) p.style.fontSize = '0.875em';
				else p.style.fontSize = '0.9em';
			});
			
			imageWrappers.forEach(wrapper => {
				wrapper.style.transform = 'none';
				
				if (angle > 0) {
					wrapper.style.width = `${25 + (rotationProgress * 75)}%`;
					wrapper.style.height = `${100 - (rotationProgress * 75)}%`;
				}
				
				const img = wrapper.querySelector('img');
				if (img) {
					let imgMaxHeight = 70;
					if (angle >= 90) imgMaxHeight = 70;
					else if (angle > 60) imgMaxHeight = 70 - ((angle - 60) / 30 * 20);
					img.style.maxHeight = `${imgMaxHeight}%`;
				}
				
				const p = wrapper.querySelector('p');
				if (p) {
					let textMargin = 3;
					if (angle >= 90) textMargin = 1.5;
					else if (angle > 60) textMargin = 3 - ((angle - 60) / 30 * 1.5);
					p.style.marginTop = `${textMargin}em`;
				}
			});
			
			if (angle > 60) {
				const extraSize = (angle - 60) / 30 * 10;
				container.style.height = `calc(100vh + ${extraSize}%)`;
				container.style.width = `calc(100vw + ${extraSize}%)`;
			} else {
				container.style.height = '100vh';
				container.style.width = '100vw';
			}
		}
		
		let resizeTimeout;
		window.addEventListener('resize', () => {
			clearTimeout(resizeTimeout);
			resizeTimeout = setTimeout(handleResize, 10);
		});
		
		document.querySelectorAll('img').forEach(img => {
			img.addEventListener('mouseenter', function() {
				const width = window.innerWidth;
				const verticalWidth = 800, maxWidth = 1200;
				
				if (width > verticalWidth) {
					let angle = 0;
					if (width <= maxWidth && width >= verticalWidth) {
						angle = 90 * (maxWidth - width) / (maxWidth - verticalWidth);
					}
					
					this.style.transform = `rotate(${-angle}deg) scale(1.02)`;
					const p = this.nextElementSibling;
					if (p && p.tagName === 'P') {
						p.style.opacity = '1';
						p.style.zIndex = '1000';
					}
				}
			});
			
			img.addEventListener('mouseleave', function() {
				const width = window.innerWidth;
				const verticalWidth = 800, maxWidth = 1200;
				
				if (width > verticalWidth) {
					let angle = 0;
					if (width <= maxWidth && width >= verticalWidth) {
						angle = 90 * (maxWidth - width) / (maxWidth - verticalWidth);
					}
					
					this.style.transform = `rotate(${-angle}deg)`;
					const p = this.nextElementSibling;
					if (p && p.tagName === 'P') {
						p.style.opacity = '0';
						p.style.zIndex = '100';
					}
				}
			});
		});
		
		handleResize();
	</script>
</body>
</html>
